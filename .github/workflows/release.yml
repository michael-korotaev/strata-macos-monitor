name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: ./build.sh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StrataMonitor.zip
          generate_release_notes: true
