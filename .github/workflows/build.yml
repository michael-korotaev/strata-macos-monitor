name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package the app
        run: ./build.sh

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: StrataMonitor-macOS
          path: dist/StrataMonitor.zip
          if-no-files-found: error
